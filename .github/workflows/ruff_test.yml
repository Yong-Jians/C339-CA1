name : ruff workflow

on:
    push:
        branches: [main]


jobs:
    tests:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: setup python
          uses: actions/setup-python@v7
          with:
            python-version: '3.12' 

        
        - name: Install ruff
          run: pip install ruff

        - name: Check code quality
          run : python -m ruff check .


