name : Vunerability test python

on:
    push:
        branches: [main]


jobs:
    tests:
     runs-on: ubuntu-latest

     steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: setup python
          uses: actions/setup-python@v7
          with:
            python-version: '3.12' 

        
        - name: Install pip-audit
          run: pip install pip-audit 

        - name: Check for package vunerabilties
          run: pip-audit

          

